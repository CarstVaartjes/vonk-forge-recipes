[project]
# Tooling and producer checks run on 3.14. Adapter sources (excluded from the
# gates) still target 3.12 because the container images they overlay do.
name = "vonk-forge-recipes"
version = "0.0.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
# Adapter tests are upstream's (they need torch/vllm) and run only in upstream's
# image build, never in our CI. Our tests/ validate adapter files from outside.
norecursedirs = ["adapters", ".git", "node_modules", ".venv"]

[tool.ruff]
# The pinned formatter and linter are the repository's formatting authority for
# our own code: tools/, scripts/, tests/, contracts/ and platform helpers.
# Everything under adapters/ follows its upstream recipe (vendored patches,
# launch scripts, wrappers derived from upstream creators), so a recipe is never
# blocked because upstream code does not match our style. Adapter behavior stays
# covered by the functional tests (contract validation, executability, pins).
required-version = "==0.16.9"
target-version = "py312"
force-exclude = true
exclude = ["adapters"]

[tool.pyright]
# One checker for our own code; adapters are excluded (see [tool.ruff]). The mode and the
# language version are pinned because both change which diagnostics exist:
# an unconfigured pyright reports hundreds of extra findings, so the reviewed
# baseline would otherwise depend on the host interpreter and on defaults.
pythonVersion = "3.14"
typeCheckingMode = "basic"
# The contracts package is not installed in the environment CI checks with, so
# its import root is declared here exactly as the test suites add it. Without
# it every contract import is an unresolved-import finding.
extraPaths = ["contracts/src"]
exclude = [
    "**/__pycache__/**",
    "**/node_modules/**",
    "**/.venv/**",
    # Adapters follow their upstream recipe; see [tool.ruff].
    "adapters",
]
