[project]
# Tooling and producer checks run on 3.14. Adapter sources (excluded from the
# gates) still target 3.12 because the container images they overlay do.
name = "vonk-forge-recipes"
version = "0.0.0"
requires-python = ">=3.14"

[tool.uv]
required-version = ">=0.13.5"

[tool.pytest.ini_options]
# Adapter tests are upstream's (they need torch/vllm) and run only in upstream's
# image build, never in our CI. Our tests/ validate adapter files from outside.
norecursedirs = ["adapters", ".git", "node_modules", ".venv"]
# Tests import their helpers and each other by bare module name; every test folder is a root.
pythonpath = [
    "contracts/src",
    ".",
    "src",
    "tests",
    "tests/qualification",
    "tests/recipes",
    "tests/refresh_upstream",
    "tests/sweep",
    "tests/tools",
]

[dependency-groups]
# The one owner of the lint and type-check tool versions is uv.lock. pytest, pydantic and
# Pillow are here because the type gate must resolve the suite's fixtures and the
# canonical contract types against their real classes, not unresolved imports.
dev = [
    "ruff>=0.16.9",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pydantic>=2.13.4",
    "Pillow>=13.0.0",
]

[tool.ruff]
# Ruff is the repository's lint and formatting authority for our own code: tools/,
# scripts/, tests/, contracts/ and platform helpers. Everything under adapters/
# follows its upstream recipe (vendored patches, launch scripts, wrappers derived
# from upstream creators), so a recipe is never blocked because upstream code does
# not match our style. Adapter behavior stays covered by the functional tests.
target-version = "py314"
force-exclude = true
exclude = ["adapters"]
# Every extensionless entry point in tools/ (and the type-gate script) is Python by
# shebang; every other file in tools/ has a suffix, so `tools/*.*` is excluded.
# `ruff check --show-files` is the one owner of "which files are Python".
extend-include = ["tools/*", "scripts/check-python-types"]
extend-exclude = ["tools/*.*"]

[tool.ruff.lint.isort]
# Classification must not depend on what is installed.
known-first-party = ["vonk_forge_contracts", "recipe_tooling", "spark_sweep"]

[tool.pyright]
# One checker for our own code; adapters are excluded (see [tool.ruff]). The mode and the
# language version are pinned because both change which diagnostics exist:
# an unconfigured pyright reports hundreds of extra findings, so the zero-error
# gate would otherwise depend on the host interpreter and on defaults.
pythonVersion = "3.14"
typeCheckingMode = "basic"
# A `# pyright: ignore` that no longer suppresses anything is an error.
reportUnnecessaryTypeIgnoreComment = "error"
# The contracts package is not installed in the environment CI checks with, so
# its import root is declared here exactly as the test suites add it. Without
# it every contract import is an unresolved-import finding.
extraPaths = [
    "contracts/src",
    "src",
    "tests",
    "tests/qualification",
    "tests/recipes",
    "tests/refresh_upstream",
    "tests/sweep",
    "tests/tools",
]
exclude = [
    "**/__pycache__/**",
    "**/node_modules/**",
    "**/.venv/**",
    # Adapters follow their upstream recipe; see [tool.ruff].
    "adapters",
]
