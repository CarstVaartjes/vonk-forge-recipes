[project]
# Tooling and producer checks run on 3.14. Adapter sources (excluded from the
# gates) still target 3.12 because the container images they overlay do.
name = "vonk-forge-recipes"
version = "0.0.0"
requires-python = ">=3.14"

[tool.uv]
required-version = ">=0.13.5"
# One environment for the type gate, lint, tests and tools: the gate resolves the same
# packages everywhere, so `uv run` agrees with CI.
default-groups = ["dev", "producer-tests"]

[tool.pytest.ini_options]
# Adapter tests are upstream's (they need torch/vllm) and run only in upstream's
# image build, never in our CI. Our tests/ validate adapter files from outside.
norecursedirs = ["adapters", ".git", "node_modules", ".venv"]
# Tests import their helpers and each other by bare module name; every test folder is a root.
pythonpath = [
    "contracts/src",
    ".",
    "src",
    "tests",
    "tests/qualification",
    "tests/recipes",
    "tests/refresh_upstream",
    "tests/sweep",
    "tests/tools",
]

[dependency-groups]
# The one owner of the lint and type-check tool versions is uv.lock. pytest, pydantic and
# Pillow are here because the type gate must resolve the suite's fixtures and the
# canonical contract types against their real classes, not unresolved imports.
dev = [
    "ruff>=0.16.9",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pydantic>=2.13.4",
    "Pillow>=13.0.0",
]
# The producer test environment (validate.yml, publish.yml, refresh-upstream.yml):
# `uv sync --frozen` (a default group); uv.lock is the one owner of every version.
producer-tests = [
    "vonk-forge-public-contracts",
    "jsonschema>=4.24,<5",
    "pytest-xdist==3.8.0",
    "numpy==2.3.5",
    "trimesh==4.10.1",
]

[tool.uv.sources]
vonk-forge-public-contracts = { path = "contracts", editable = true }

[tool.ruff]
# Ruff is the repository's lint and formatting authority for our own code: tools/,
# scripts/, tests/, contracts/ and platform helpers. Everything under adapters/
# follows its upstream recipe (vendored patches, launch scripts, wrappers derived
# from upstream creators), so a recipe is never blocked because upstream code does
# not match our style. Adapter behavior stays covered by the functional tests.
# Stays 3.12: the CI jobs run tools/ launchers with the runner's own python3 and import
# recipe_tooling, so the source must parse there (the 3.14 `except A, B:` form does not).
target-version = "py312"
force-exclude = true
exclude = ["adapters"]
# Every extensionless entry point in tools/ (and the type-gate script) is Python by
# shebang; every other file in tools/ has a suffix, so `tools/*.*` is excluded.
# `ruff check --show-files` is the one owner of "which files are Python".
extend-include = ["tools/*", "scripts/check-python-types"]
extend-exclude = ["tools/*.*"]

[tool.ruff.lint]
extend-select = [
    "E4", "E7", "E9",  # E402 is the companion of PLC0415; E731 lambda assignment
    "PLC", "PLE", "PLR", "PLW",  # incl. PLC0415 import-outside-top-level
    "TID252",  # with ban-relative-imports = "all": one import spelling
    "TID251",  # banned-api (below)
    "B", "C4", "RET", "SIM", "PERF", "PT", "PTH", "FURB", "PYI", "RSE", "RUF",
    "N", "A", "ERA", "FAST", "ASYNC", "LOG", "PGH", "S", "ARG", "FBT001", "FBT002",
]
ignore = [
    "PLR0904", "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0916", "PLR0917", "PLR1702",
    # size/complexity ceilings: numeric thresholds are count-ceilings
    "PLR2004",  # magic-value-comparison: mostly tests asserting literal expected values
    "PLR6301",  # no-self-use: methods on protocol/fake classes keep self for the interface
    "PLC2701",  # private import: package-private _modules are the layering convention
    "PLW1514",  # unspecified-encoding: UTF-8 mode is the 3.15 default
    "PT011",    # pytest.raises too broad: the fix is match="..." on message text (wording test)
    "RUF043",   # ambiguous match= pattern: polishes wording asserts that should not exist
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode is intentional in user-facing text
    "N818",     # exception names without Error suffix: renames of wire-visible names
    "A002",     # argument shadows builtin: wire names (id, type)
    "S101",     # assert: pytest's assertion style
    "S104", "S105", "S106", "S108", "S311",  # bind-all/hardcoded-secret/tmp/random: fixture noise
    "S603", "S607",  # subprocess audit: flags every call; the git-in-tests guard is the real rule
    "S310",     # urlopen scheme audit: urlopen is banned via TID251
]

[tool.ruff.lint.per-file-ignores]
# Tests: unused fixture/monkeypatch parameters and bool test parameters are pytest idiom.
"**/tests/**" = ["ARG", "FBT001", "FBT002"]
# Six assertions compare real git results (and one test builds a git argv); tests never use
# git, and rewriting them would re-add those git lines for the added-line guard.
"tests/refresh_upstream/test_apply.py" = ["PT009"]
"tests/qualification/test_absolute_kv_capacity.py" = ["RUF005"]  # the same, one git argv
# Relative imports are banned only inside the installable packages: recipe_tooling and the contracts.
"!{src,contracts/src}/**" = ["TID252"]
# The one module that opens provider URLs.
"src/recipe_tooling/upstream_http.py" = ["TID251"]

[tool.ruff.lint.isort]
# Classification must not depend on what is installed.
known-first-party = ["vonk_forge_contracts", "recipe_tooling", "spark_sweep"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib.request.urlopen".msg = "use recipe_tooling.upstream_http"
"urllib.request.build_opener".msg = "use recipe_tooling.upstream_http"

[tool.pyright]
# One checker for our own code; adapters are excluded (see [tool.ruff]). The mode and the
# language version are pinned because both change which diagnostics exist:
# an unconfigured pyright reports hundreds of extra findings, so the zero-error
# gate would otherwise depend on the host interpreter and on defaults.
pythonVersion = "3.14"
# The diagnostics are defined for Linux, where CI runs: a Mac hook and the CI agree.
pythonPlatform = "Linux"
typeCheckingMode = "standard"
# Strict-mode checks with behaviour value, on everywhere:
# a `# pyright: ignore` that no longer suppresses anything is an error,
reportUnnecessaryTypeIgnoreComment = "error"
# a `match` over an enum or union covers every case (explicit state machines),
reportMatchNotExhaustive = "error"
# and a check that can never fail, a cast that changes nothing, a deprecated API, a
# generic without arguments or a method without self/cls is a mistake or dead code.
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryCast = "error"
reportDeprecated = "error"
reportMissingTypeArgument = "error"
reportSelfClsParameterName = "error"
# The contracts package is not installed in the environment CI checks with, so
# its import root is declared here exactly as the test suites add it. Without
# it every contract import is an unresolved-import finding.
extraPaths = [
    "contracts/src",
    "src",
    "tests",
    "tests/qualification",
    "tests/recipes",
    "tests/refresh_upstream",
    "tests/sweep",
    "tests/tools",
]
exclude = [
    "**/__pycache__/**",
    "**/node_modules/**",
    "**/.venv/**",
    # Adapters follow their upstream recipe; see [tool.ruff].
    "adapters",
]
