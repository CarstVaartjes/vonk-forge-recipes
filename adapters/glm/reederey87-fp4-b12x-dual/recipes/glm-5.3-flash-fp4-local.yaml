# ============================================================================
# GLM-5.3-Flash-FP4-Local on 2x DGX Spark — B12X recipe
# ============================================================================
# Adapted from the checked-in NVIDIA model card for
# nvidia/GLM-5.3-Flash-FP4-Local (2 x DGX Spark, 1M context) and from
# eugr/spark-vllm-docker recipes/glm-5.3-flash.yaml at the pinned launcher ref.
#
# The command block is emitted into a generated exec script: it must not carry
# `#` comment lines (the framework folds them into the shell line). Notes go
# here, above the block.
#
# Every flag below is load-bearing; docs/01-qualification.md records what each
# one buys and what was rejected. Do not add a treatment to this file outside a
# pre-registered window (AGENTS.md).
# ============================================================================
recipe_version: "1"
name: GLM-5.3-Flash-FP4-Local (B12X, 2x DGX Spark)
description: 320B MoE FP4-Local on two GB10 Sparks, TP2 over RoCE, B12X kernels, MTP-5
model: nvidia/GLM-5.3-Flash-FP4-Local
container: vllm-node-b12x
cluster_only: true

defaults:
  host: 127.0.0.1
  port: 8000
  tensor_parallel: 2
  decode_context_parallel: 1
  block_size: 256
  max_model_len: 1000000
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  num_speculative_tokens: 3
  kv_cache_bytes: 17G
  gpu_memory_utilization: 0.87

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  VLLM_ROCE_ALLGATHER_MAX_SIZE: "16MB"
  NCCL_BUFFSIZE: "1048576"
  NCCL_MAX_CTAS: "8"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_POLICY_MODE: "auto"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

command: |
  vllm serve nvidia/GLM-5.3-Flash-FP4-Local \
    --revision 76348ddb2be2e35e39ecfc00e75dc07703f4f3d5 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --decode-context-parallel-size {decode_context_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-prompt-tokens-details \
    --mm-processor-cache-gb 0 \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --kv-cache-memory-bytes {kv_cache_bytes} \
    --quantization modelopt_mixed \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend b12x \
    --linear-backend b12x \
    --no-enable-flashinfer-autotune \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"moe_backend":"humming","attention_backend":"B12X"}}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --gpu-memory-utilization {gpu_memory_utilization}
