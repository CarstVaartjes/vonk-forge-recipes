name: Set up tooling with the advisory-pinned trust bundle
description: Install the single repository uv pin
runs:
  using: composite
  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.13.5"
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: |
          .github/requirements-*.txt
        # Pull requests restore the cache main last saved; only main writes it.
        save-cache: ${{ github.ref == 'refs/heads/main' }}

    - name: Prepare the advisory-pinned Python trust bundle
      shell: bash
      run: |
        set -euo pipefail
        tooling_venv="$RUNNER_TEMP/ca-tooling-venv"
        uv venv --python 3.14 "$tooling_venv"
        uv pip install --python "$tooling_venv/bin/python" --require-hashes -r .github/requirements-tooling.txt
        bundle=$("$tooling_venv/bin/python" -c 'import certifi; print(certifi.where())')
        echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"
        echo "REQUESTS_CA_BUNDLE=$bundle" >> "$GITHUB_ENV"
        echo "CURL_CA_BUNDLE=$bundle" >> "$GITHUB_ENV"

    # Declared adapter sources are verified once into this cache; the key follows
    # the manifest, and the restore prefix keeps blobs an older manifest held.
    - name: Cache adapter source blobs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/vonk-forge-recipes/adapter-sources
        key: adapter-sources-${{ hashFiles('adapter-sources.json') }}
        restore-keys: adapter-sources-
