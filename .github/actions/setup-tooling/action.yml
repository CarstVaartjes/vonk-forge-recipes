name: Set up tooling with current CA certificates
description: Refresh runner trust and install the single repository uv pin
runs:
  using: composite
  steps:
    - name: Refresh system certificates before TLS downloads
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --only-upgrade ca-certificates
        sudo update-ca-certificates

    - name: Set up uv and Python
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.13.5"
        python-version: "3.14"
        enable-cache: false

    - name: Prepare the advisory-pinned Python trust bundle
      shell: bash
      run: |
        set -euo pipefail
        tooling_venv="$RUNNER_TEMP/ca-tooling-venv"
        uv venv --python 3.14 "$tooling_venv"
        uv pip install --python "$tooling_venv/bin/python" --require-hashes -r .github/requirements-tooling.txt
        bundle=$("$tooling_venv/bin/python" -c 'import certifi; print(certifi.where())')
        echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"
        echo "REQUESTS_CA_BUNDLE=$bundle" >> "$GITHUB_ENV"
        echo "CURL_CA_BUNDLE=$bundle" >> "$GITHUB_ENV"
