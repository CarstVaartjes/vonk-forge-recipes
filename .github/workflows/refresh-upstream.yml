name: Refresh upstream pins

# Hourly, no AI. Keeps recipes on the pinning rule (newest published upstream version,
# else the latest commit; Model weights at the newest revision). Mechanical refreshes
# become a bounded set of prepared pull requests (branch refresh/<recipe-id>, label
# refresh:mechanical); at most one is auto-armed after main has a successful signed
# publication and no other PR is armed. Everything else becomes one
# refresh:needs-review issue per recipe and the recipe is left untouched. See
# docs/recipe-authoring.md.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# One run at a time; never cancel a run that may be mid-push.
concurrency:
  group: refresh-upstream
  cancel-in-progress: false

permissions:
  contents: read # upstream observations; mutations use the repository-scoped App

jobs:
  refresh:
    name: Refresh recipes from upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      # ETags make repeat polls free (a 304 does not count against the API quota);
      # upstream trees and Model inventories are immutable per commit.
      - name: Restore the upstream cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/refresh-cache
          key: refresh-cache-${{ github.run_id }}
          restore-keys: refresh-cache-

      - name: Install the tool dependencies
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/refresh-venv"
          uv venv --python 3.14 "$venv"
          uv pip install --python "$venv/bin/python" -e contracts 'jsonschema>=4.24,<5' 'pytest==9.1.1'
          echo "REFRESH_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      - name: Test upstream inventory and refresh classification
        run: '"$REFRESH_PYTHON" -m pytest -q tests/test_check_upstream_drift.py tests/test_refresh_upstream.py'

      - name: Refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH_APP_CLIENT_ID: ${{ vars.REFRESH_APP_CLIENT_ID }}
          REFRESH_APP_PRIVATE_KEY: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$REFRESH_PYTHON" tools/refresh-upstream --github-app --cache-dir "$RUNNER_TEMP/refresh-cache"
