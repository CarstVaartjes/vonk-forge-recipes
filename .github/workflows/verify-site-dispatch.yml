name: Verify site dispatch

# Dry run of the publish workflow's last job: mints the refresh App token for
# vonk-forge-web and checks its scope, and dispatches nothing.
on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify the App token for the site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify App authentication and site scope
        env:
          REFRESH_APP_CLIENT_ID: ${{ vars.REFRESH_APP_CLIENT_ID }}
          REFRESH_APP_PRIVATE_KEY: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
        run: python3 tools/dispatch-site-build --verify
