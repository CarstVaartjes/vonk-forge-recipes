name: Audit upstream drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  audit:
    name: Compare immutable pins with upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: false

      - name: Install the shared Model and Recipe contracts
        shell: bash
        run: |
          set -euo pipefail
          audit_venv="$RUNNER_TEMP/upstream-audit-venv"
          uv venv --python 3.12 "$audit_venv"
          uv pip install --python "$audit_venv/bin/python" -e contracts
          echo "UPSTREAM_AUDIT_PYTHON=$audit_venv/bin/python" >> "$GITHUB_ENV"

      - name: Test the drift checker offline
        run: '"$UPSTREAM_AUDIT_PYTHON" -m unittest discover -s tests -p test_check_upstream_drift.py'

      - name: Check upstream revisions
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          "$UPSTREAM_AUDIT_PYTHON" tools/check-upstream-drift \
            --fail-on-drift \
            --output upstream-drift.json \
            > upstream-drift.txt
          status=$?
          set -e
          {
            echo "## Upstream drift audit"
            echo
            echo '```text'
            cat upstream-drift.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-drift-report
          path: |
            upstream-drift.json
            upstream-drift.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce audit result
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        shell: bash
        run: |
          case "$EXIT_CODE" in
            0) exit 0 ;;
            2)
              echo "::warning::One or more upstream sources advanced; review the report before changing immutable pins."
              exit 2
              ;;
            *)
              echo "::error::The drift audit could not verify every watched source."
              exit 1
              ;;
          esac
