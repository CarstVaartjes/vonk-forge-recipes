name: Audit upstream drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  audit:
    name: Compare immutable pins with upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      - name: Install the shared Model and Recipe contracts
        shell: bash
        run: |
          set -euo pipefail
          audit_venv="$RUNNER_TEMP/upstream-audit-venv"
          uv venv --python 3.14 "$audit_venv"
          uv pip install --python "$audit_venv/bin/python" -e contracts
          echo "UPSTREAM_AUDIT_PYTHON=$audit_venv/bin/python" >> "$GITHUB_ENV"

      - name: Test the drift checker offline
        run: '"$UPSTREAM_AUDIT_PYTHON" -m unittest discover -s tests -p test_check_upstream_drift.py'

      # Report-only: advanced or vanished upstream pins are listed in the job
      # summary for review, never a failed run. The job fails only when the
      # tool itself cannot produce a report or cannot query a watched source.
      - name: Check upstream revisions
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          "$UPSTREAM_AUDIT_PYTHON" tools/check-upstream-drift \
            --output upstream-drift.json \
            > upstream-drift.txt
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Summarize drift
        if: always()
        shell: bash
        run: |
          "$UPSTREAM_AUDIT_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Upstream drift audit (report only)", ""]
          report_path = Path("upstream-drift.json")
          if not report_path.is_file():
              lines.append("The drift tool did not produce a report; see the step log.")
              with summary.open("a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          counts = report["counts"]
          lines.append(
              "Checked at "
              + report["checked_at"]
              + ": "
              + ", ".join(f"{counts[key]} {key}" for key in counts)
              + "."
          )
          lines.append("")
          embedded = report.get("embedded_inputs", {})
          coverage = embedded.get("coverage", {})
          embedded_counts = coverage.get("counts_by_status", {})
          candidate_counts = coverage.get("counts_by_candidate_status", {})
          lines.append(
              "Embedded-input inventory across "
              + str(coverage.get("recipe_count", 0))
              + " recipes: "
              + (", ".join(f"{count} {status}" for status, count in sorted(embedded_counts.items())) or "no records")
              + "."
          )
          if candidate_counts:
              lines.append(
                  "Observed default-branch candidates: "
                  + ", ".join(f"{count} {status}" for status, count in sorted(candidate_counts.items()))
                  + "."
              )
          lines.append(
              "This derived local inventory has known limits: immutable digests and embedded pins have no implied moving channel, and unresolved transitive dependencies remain unknown. Candidate heads are review evidence, not recommendations."
          )
          lines.append("")
          actionable = []
          for recipe in embedded.get("recipes", []):
              for item in recipe.get("inputs", []):
                  if item.get("status") in {"mutable", "unknown", "pin_only", "pinned_untracked", "untracked"} or item.get("candidate_status") in {"advanced", "unknown", "no-immutable-pin"}:
                      actionable.append((recipe.get("recipe_id", "?"), item))
          lines.append(f"### Embedded inputs requiring visibility: {len(actionable)}")
          lines.append("")
          if not actionable:
              lines.append("None.")
              lines.append("")
          else:
              for recipe_id, item in actionable[:50]:
                  location = item.get("path") or "-"
                  if item.get("line") is not None:
                      location += f":{item['line']}"
                  reference = item.get("reference") or item.get("url") or item.get("repository") or item.get("slug") or "-"
                  candidate = item.get("candidate_revision")
                  pinned = item.get("revision")
                  change = f" ({str(pinned)[:12]} → {str(candidate)[:12]})" if candidate and pinned else ""
                  status = item.get("status", "unknown")
                  candidate_status = item.get("candidate_status")
                  if candidate_status:
                      status += f" / candidate {candidate_status}"
                  reason = item.get("candidate_reason") or item.get("reason") or "no reason recorded"
                  reason = str(reason).replace("|", "\\|").replace("\n", " ")
                  lines.append(f"- `{recipe_id}` `{item.get('kind', '?')}` at `{location}`: `{reference}`{change}; {status}. {reason}")
              if len(actionable) > 50:
                  lines.append(f"- … {len(actionable) - 50} additional embedded records omitted from this bounded summary; see the uploaded JSON artifact.")
              lines.append("")
          sections = (
              ("advanced", "Drifted pins (upstream advanced)"),
              ("missing", "Pins no longer resolvable upstream"),
              ("error", "Sources that could not be checked"),
          )
          for status, title in sections:
              rows = [o for o in report["observations"] if o["status"] == status]
              lines.append(f"### {title}: {len(rows)}")
              lines.append("")
              if not rows:
                  lines.append("None.")
                  lines.append("")
                  continue
              lines.append("| Entity | Source | Pinned | Observed | Policy |")
              lines.append("| --- | --- | --- | --- | --- |")
              for o in rows:
                  observed = o.get("observed_version") or (o.get("observed_revision") or "-")[:12]
                  if o.get("upstream_url"):
                      observed = f"[{observed}]({o['upstream_url']})"
                  elif o.get("detail"):
                      observed = o["detail"]
                  lines.append(
                      f"| `{o['entity']}` | {o['provider']}:{o['repository']} "
                      f"| `{o['pinned_revision'][:12]}` | {observed} | {o['policy']} |"
                  )
              lines.append("")
          lines.append(
              "Drift is informational: review the upstream change before moving an immutable pin."
          )
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-drift-report
          path: |
            upstream-drift.json
            upstream-drift.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail only on tool errors
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        shell: bash
        run: |
          # The tool exits 1 both for a vanished pin and for an unverifiable
          # source; only the latter (or no report at all) is a failure here.
          if [ ! -s upstream-drift.json ]; then
            echo "::error::The drift tool exited $EXIT_CODE without writing a report."
            exit 1
          fi
          errors=$("$UPSTREAM_AUDIT_PYTHON" -c 'import json; print(json.load(open("upstream-drift.json"))["counts"]["error"])')
          if [ "$errors" != "0" ]; then
            echo "::error::$errors watched source(s) could not be checked; see the job summary."
            exit 1
          fi
          drifted=$("$UPSTREAM_AUDIT_PYTHON" -c 'import json; c = json.load(open("upstream-drift.json"))["counts"]; print(c["advanced"] + c["missing"])')
          if [ "$drifted" != "0" ]; then
            echo "::notice::$drifted pinned source(s) drifted upstream; see the job summary."
          fi
