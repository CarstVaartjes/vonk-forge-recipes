name: Publish recipe library release

on:
  # Every merge to main publishes a new patch release; docs-only changes don't.
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag, for example v1.2.0 (default: next patch)"
        required: false
        type: string

# One publication at a time, in merge order, so tags never race.
concurrency:
  group: publish-recipe-library
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    uses: CarstVaartjes/vonk-forge/.github/workflows/validate-recipe-library.yml@bc7875f9c8556a7386a873b653c1a7a10de2200d
    with:
      # Keep release validation on the same published Forge authority as PR
      # validation; recipe publication is independent of Forge release CI.
      platform_ref: bc7875f9c8556a7386a873b653c1a7a10de2200d

  producer-contracts:
    name: Validate producer contracts and packages
    uses: ./.github/workflows/validate.yml
    with:
      producer_only: true

  catalog-index:
    name: Verify catalog index
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      - name: Build the release asset set twice and require identical bytes
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/catalog-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/first"
          "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/second"
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"

  publish:
    name: Create signed library release
    needs: [validate, producer-contracts, catalog-index]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: recipe-release
    # Control planes accept only assets whose SHA256SUMS carries a Sigstore
    # attestation from this workflow on refs/heads/main of this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      - name: Install producer contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/release-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          echo "RELEASE_TEST_PYTHON=$test_venv/bin/python" >> "$GITHUB_ENV"

      - name: Lint and type check the repository before publishing
        shell: bash
        run: |
          set -euo pipefail
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" tools/check-python-lint
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" tools/check-python-format
          UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" scripts/check-python-types

      - name: Choose the release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --quiet --force --tags origin
          if [ -n "$(git tag --points-at "$GITHUB_SHA" --list 'v*.*.*')" ]; then
            echo "commit already released: $(git tag --points-at "$GITHUB_SHA" --list 'v*.*.*')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v${major:-1}.${minor:-0}.$(( ${patch:--1} + 1 ))"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release_tag must use vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "release tag already exists: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release assets from the release commit
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Coverage is derived offline from this build and the committed authority.
          "$RELEASE_TEST_PYTHON" tools/build-catalog-index --source-commit "$GITHUB_SHA"
          "$RELEASE_TEST_PYTHON" tools/build-family-aware-coverage
          "$RELEASE_TEST_PYTHON" tools/build-catalog-index \
            --release-dir "$RUNNER_TEMP/release" --source-commit "$GITHUB_SHA" \
            --include qualification/coverage/family-aware-coverage-2026-09-24.json \
            --include qualification/coverage/family-aware-coverage-2026-09-24.md

      - name: Attest the release checksum manifest
        if: steps.tag.outputs.skip != 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/SHA256SUMS

      - name: Create immutable tag and release with signed assets
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/release/SHA256SUMS.sigstore.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" --message "Vonk Forge recipe library $RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
          # Upload every asset to a draft first: "latest" must never name a
          # release whose signed asset set is incomplete.
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
            --generate-notes --title "Vonk Forge recipes $RELEASE_TAG" \
            "$RUNNER_TEMP"/release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
