name: Publish recipe library release

# The library release version is the contract version (v<CONTRACT_VERSION>).
# Recipe changes update that release in place; an additive contract change
# (minor) or a breaking one (major) creates a new release. Its tag stays on the
# commit that first published the contract version: consumers address the
# release by tag name and take the commit from the signed bundle, and
# GITHUB_TOKEN may not point a ref at a commit whose workflow files differ from
# main's, which is every publish that lags a newer workflow change.
#
# This is the only workflow that runs on a push to main: it orchestrates the
# validation jobs (the platform validator, the producer checks reused from
# validate.yml with their light/full scope logic, the catalog index) and the
# recipe runtime images (recipe-images.yml), and the publish job fans in on
# all of them. Pull requests run validate.yml directly.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# One publication at a time, in merge order, so release updates never race.
concurrency:
  group: publish-recipe-library
  cancel-in-progress: false

# Called workflows fail at startup when a job asks for a permission the caller
# does not grant, so each job below grants exactly what it (and what it calls)
# needs. The producer call must also permit its nested PR-only image jobs,
# even though those jobs are skipped on main.
permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: CarstVaartjes/vonk-forge/.github/workflows/validate-recipe-library.yml@999329d55ba98ed4133d6e3dbdc2a51638134714
    with:
      # Use the same reviewed Forge contract/runtime-policy validator as PR
      # validation; publication remains independent of Forge release CI.
      platform_ref: 999329d55ba98ed4133d6e3dbdc2a51638134714

  producer-contracts:
    name: Validate producer contracts and packages
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/validate.yml
    with:
      producer_only: true

  catalog-index:
    name: Verify catalog index
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: ./.github/actions/setup-tooling

      - name: Build the release asset set twice and require identical bytes
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/catalog-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/first"
          "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/second"
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"

  # The recipes are estimates until the hardware try measures them: a PR token
  # cannot edit issues, so the main run keeps one issue current. Nothing waits
  # for it and it blocks nothing.
  memory-estimates:
    name: Keep the memory estimate issue current
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Never marks the publish run failed: refresh-upstream reads the run result.
    continue-on-error: true
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The report judges a moved recipe against its pre-move content:
          # full history without blobs (commits and trees, a few MB); git
          # fetches the few predecessor blobs it shows on demand. A bounded
          # depth would relist every move older than the window.
          fetch-depth: 0
          filter: blob:none

      - name: Set up uv and Python
        uses: ./.github/actions/setup-tooling

      - name: Report estimate mismatches and sync the one issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/memory-venv"
          uv venv --python 3.14 "$venv"
          uv pip install --python "$venv/bin/python" -e contracts -r .github/requirements-producer-tests.txt
          "$venv/bin/python" tools/check-recipe-memory-need --report "$RUNNER_TEMP/memory-estimates.md"
          "$venv/bin/python" tools/refresh-upstream --memory-estimate-issue "$RUNNER_TEMP/memory-estimates.md"

  # Promote PR-proven content digests; build only keys without a candidate
  # through the same planner, build and smoke path.
  images:
    name: Recipe runtime images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/recipe-images.yml

  publish:
    name: Create signed library release
    needs: [validate, producer-contracts, catalog-index, images]
    # Image promotion or fallback builds must complete before signing.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && needs.validate.result != 'failure'
      && needs.producer-contracts.result != 'failure'
      && needs.catalog-index.result != 'failure'
      && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: recipe-release
    # Control planes accept only assets whose SHA256SUMS carries a Sigstore
    # attestation from this workflow on refs/heads/main of this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: ./.github/actions/setup-tooling

      - name: Install producer contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/release-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          echo "RELEASE_TEST_PYTHON=$test_venv/bin/python" >> "$GITHUB_ENV"

      - name: Lint and type check the repository before publishing
        shell: bash
        run: |
          set -euo pipefail
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" tools/check-python-lint
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" tools/check-python-format
          UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" scripts/check-python-types

      - name: Resolve the release version and update time
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$("$RELEASE_TEST_PYTHON" -c 'from vonk_forge_contracts import CONTRACT_VERSION; print(CONTRACT_VERSION)')
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "contract version is not MAJOR.MINOR.PATCH: $version" >&2; exit 1 ;;
          esac
          updated_at=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$GITHUB_SHA")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "updated_at=$updated_at" >> "$GITHUB_OUTPUT"

      - name: Download the pinned prebuilt images
        id: prebuilt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilt-images
          path: ${{ runner.temp }}/prebuilt

      - name: Download the image plan for release verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-image-plan
          path: ${{ runner.temp }}/plan

      - name: Build release assets from the release commit
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/prebuilt/prebuilt-images.json"
          # Coverage is derived offline from this build (the authority is derived from it, not committed).
          "$RELEASE_TEST_PYTHON" tools/build-catalog-index --source-commit "$GITHUB_SHA"
          "$RELEASE_TEST_PYTHON" tools/build-family-aware-coverage
          "$RELEASE_TEST_PYTHON" tools/build-catalog-index \
            --release-dir "$RUNNER_TEMP/release" --source-commit "$GITHUB_SHA" \
            --include qualification/coverage/family-aware-coverage-2026-09-24.json \
            --include qualification/coverage/family-aware-coverage-2026-09-24.md \
            --prebuilt-images "$RUNNER_TEMP/prebuilt/prebuilt-images.json" \
            --include "$RUNNER_TEMP/plan/plan.json"
          "$RELEASE_TEST_PYTHON" tools/check-published-images \
            --plan "$RUNNER_TEMP/plan/plan.json" \
            --images "$RUNNER_TEMP/prebuilt/prebuilt-images.json" \
            --index "$RUNNER_TEMP/release/catalog-index.json" \
            --source-commit "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare with the published release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Only a published release counts: the tags endpoint never returns a
          # draft, so a draft left by a run that failed before undrafting is
          # replaced by the publish step instead of blocking every later run.
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          # Skip only when the release holds exactly recipe-library.tar and that
          # bundle carries this SHA256SUMS with every member matching it.
          if "$RELEASE_TEST_PYTHON" tools/sync-release-assets --tag "$RELEASE_TAG" \
            check --sums "$RUNNER_TEMP/release/SHA256SUMS"; then
            echo "release $RELEASE_TAG already publishes this complete asset set"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest the release checksum manifest
        if: steps.current.outputs.skip != 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/SHA256SUMS

      - name: Publish or update the contract-version release
        if: steps.current.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPDATED_AT: ${{ steps.release.outputs.updated_at }}
          RELEASE_EXISTS: ${{ steps.current.outputs.exists }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          cp "$ATTESTATION_BUNDLE" "$release/SHA256SUMS.sigstore.json"
          title="Vonk Forge recipes $RELEASE_TAG (updated $UPDATED_AT)"
          notes="Recipe library for contract ${RELEASE_TAG#v}, updated $UPDATED_AT from $GITHUB_SHA."
          # One asset holds the whole signed library: SHA256SUMS, its Sigstore
          # bundle and every listed file, deterministically. It is the release's
          # only asset.
          bundle="$RUNNER_TEMP/bundle/recipe-library.tar"
          mkdir -p "$(dirname "$bundle")"
          "$RELEASE_TEST_PYTHON" tools/build-release-bundle "$release" "$bundle"
          if [ "$RELEASE_EXISTS" != "true" ]; then
            # Delete leftover drafts of this tag, then upload the bundle to a
            # fresh draft first: "latest" must never name a release without its
            # bundle. Undrafting creates the tag at --target when it is missing.
            drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$RELEASE_TAG\") | .id")
            for id in $drafts; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" "$bundle"
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          # Upload the bundle when missing or different, delete every other
          # asset, and verify the release's digest and size. The run fails
          # unless the release converges to exactly the one bundle asset.
          "$RELEASE_TEST_PYTHON" tools/sync-release-assets --tag "$RELEASE_TAG" \
            publish --bundle "$bundle"
          gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes" --latest
