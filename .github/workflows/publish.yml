name: Publish recipe library release

# The library release version is the contract version (v<CONTRACT_VERSION>).
# Recipe changes update that release in place; an additive contract change
# (minor) or a breaking one (major) creates a new release.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# One publication at a time, in merge order, so release updates never race.
concurrency:
  group: publish-recipe-library
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    uses: CarstVaartjes/vonk-forge/.github/workflows/validate-recipe-library.yml@PLATFORM_REF_PLACEHOLDER
    with:
      # Keep release validation on the same published Forge authority as PR
      # validation; recipe publication is independent of Forge release CI.
      platform_ref: PLATFORM_REF_PLACEHOLDER

  producer-contracts:
    name: Validate producer contracts and packages
    uses: ./.github/workflows/validate.yml
    with:
      producer_only: true

  catalog-index:
    name: Verify catalog index
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      - name: Build the release asset set twice and require identical bytes
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/catalog-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/first"
          "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/second"
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"

  publish:
    name: Create signed library release
    needs: [validate, producer-contracts, catalog-index]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: recipe-release
    # Control planes accept only assets whose SHA256SUMS carries a Sigstore
    # attestation from this workflow on refs/heads/main of this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      - name: Install producer contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/release-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          echo "RELEASE_TEST_PYTHON=$test_venv/bin/python" >> "$GITHUB_ENV"

      - name: Lint and type check the repository before publishing
        shell: bash
        run: |
          set -euo pipefail
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" tools/check-python-lint
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" tools/check-python-format
          UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" scripts/check-python-types

      - name: Resolve the release version and update time
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$("$RELEASE_TEST_PYTHON" -c 'from vonk_forge_contracts import CONTRACT_VERSION; print(CONTRACT_VERSION)')
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "contract version is not MAJOR.MINOR.PATCH: $version" >&2; exit 1 ;;
          esac
          updated_at=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$GITHUB_SHA")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "updated_at=$updated_at" >> "$GITHUB_OUTPUT"

      - name: Build release assets from the release commit
        shell: bash
        run: |
          set -euo pipefail
          # Coverage is derived offline from this build and the committed authority.
          "$RELEASE_TEST_PYTHON" tools/build-catalog-index --source-commit "$GITHUB_SHA"
          "$RELEASE_TEST_PYTHON" tools/build-family-aware-coverage
          "$RELEASE_TEST_PYTHON" tools/build-catalog-index \
            --release-dir "$RUNNER_TEMP/release" --source-commit "$GITHUB_SHA" \
            --include qualification/coverage/family-aware-coverage-2026-09-24.json \
            --include qualification/coverage/family-aware-coverage-2026-09-24.md

      - name: Compare with the published release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/current"
          mkdir -p "$current"
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          if gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$current" \
            && cmp -s "$current/SHA256SUMS" "$RUNNER_TEMP/release/SHA256SUMS"; then
            echo "release $RELEASE_TAG already publishes this asset set"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest the release checksum manifest
        if: steps.current.outputs.skip != 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/SHA256SUMS

      - name: Publish or update the contract-version release
        if: steps.current.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPDATED_AT: ${{ steps.release.outputs.updated_at }}
          RELEASE_EXISTS: ${{ steps.current.outputs.exists }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          cp "$ATTESTATION_BUNDLE" "$release/SHA256SUMS.sigstore.json"
          title="Vonk Forge recipes $RELEASE_TAG (updated $UPDATED_AT)"
          notes="Recipe library for contract ${RELEASE_TAG#v}, updated $UPDATED_AT from $GITHUB_SHA."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "$RELEASE_TAG" \
            --message "Vonk Forge recipe library $RELEASE_TAG, updated $UPDATED_AT" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"
          if [ "$RELEASE_EXISTS" != "true" ]; then
            # Upload every asset to a draft first: "latest" must never name a
            # release whose signed asset set is incomplete.
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" "$release"/*
            gh release edit "$RELEASE_TAG" --draft=false --latest
            exit 0
          fi
          # Update in place: content first, then the signed manifest, then drop
          # assets the new manifest no longer lists. A reader that sees a mixed
          # set fails verification once and heals on its next sync.
          content=()
          for path in "$release"/*; do
            case "$(basename "$path")" in
              SHA256SUMS | SHA256SUMS.sigstore.json) ;;
              *) content+=("$path") ;;
            esac
          done
          gh release upload "$RELEASE_TAG" --clobber "${content[@]}"
          gh release upload "$RELEASE_TAG" --clobber \
            "$release/SHA256SUMS" "$release/SHA256SUMS.sigstore.json"
          keep=$(ls "$release")
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if ! grep -qxF "$name" <<< "$keep"; then
                gh release delete-asset "$RELEASE_TAG" "$name" --yes
              fi
            done
          gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes" --latest
