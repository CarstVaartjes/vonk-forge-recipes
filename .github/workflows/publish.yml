name: Publish recipe library release

# The library release version is the contract version (v<CONTRACT_VERSION>),
# computed by the contract-version job from the change class since the last v*
# tag (tools/contract-version); Git holds only CONTRACT_MAJOR and a placeholder.
# Recipe changes update that release in place; a contract change creates a new
# release (patch, minor, or major with the CONTRACT_MAJOR bump), which also
# carries that version's contracts wheel, immutable once uploaded. Its tag stays on the
# commit that first published the contract version: consumers address the
# release by tag name and take the commit from the signed bundle, and
# GITHUB_TOKEN may not point a ref at a commit whose workflow files differ from
# main's, which is every publish that lags a newer workflow change.
#
# This is the only workflow that runs on a push to main: it orchestrates the
# validation jobs (each channel's platform validator, the producer checks reused from
# validate.yml, including the twice-built byte-equal catalog) and the
# recipe runtime images (recipe-images.yml), and the publish job fans in on
# all of them. Pull requests run validate.yml directly.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# One publication at a time, in merge order, so release updates never race.
concurrency:
  group: publish-recipe-library
  cancel-in-progress: false

# Called workflows fail at startup when a job asks for a permission the caller
# does not grant, so each job below grants exactly what it (and what it calls)
# needs. The producer call must also permit its nested PR-only image jobs,
# even though those jobs are skipped on main.
permissions:
  contents: read

jobs:
  # The same channel validation as pull requests: each channel's signed
  # recipe-tools bundle (platform-validate.yml).
  validate:
    permissions:
      attestations: read
      contents: read
    uses: ./.github/workflows/platform-validate.yml

  # Computed once; every job that builds a published file (the catalog build that
  # coverage reads, the release assets and the wheel) stamps it into its own
  # workspace's _version.py. A breaking change without the major bump fails here.
  contract-version:
    name: Compute the contract version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute the version from the change class
        id: version
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/contract-version "$RUNNER_TEMP/released" > "$RUNNER_TEMP/version.txt"
          read -r released next < "$RUNNER_TEMP/version.txt"
          # No contract change: recipe changes update the released version in place.
          version=$released
          if [ "$next" != none ]; then version=$next; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Contract version $version (last released $released)" >> "$GITHUB_STEP_SUMMARY"

  producer-contracts:
    name: Validate producer contracts and packages
    needs: [contract-version]
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/validate.yml
    with:
      producer_only: true
      contract_version: ${{ needs.contract-version.outputs.version }}

  # The recipes are estimates until the hardware try measures them: a PR token
  # cannot edit issues, so the main run keeps one issue current. Nothing waits
  # for it and it blocks nothing.
  memory-estimates:
    name: Keep the memory estimate issue current
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Never marks the publish run failed: refresh-upstream reads the run result.
    continue-on-error: true
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: ./.github/actions/setup-tooling

      - name: Report estimate mismatches and sync the one issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          .venv/bin/python tools/check-recipe-memory-need --report "$RUNNER_TEMP/memory-estimates.md"
          .venv/bin/python tools/refresh-upstream --memory-estimate-issue "$RUNNER_TEMP/memory-estimates.md"

  # Promote PR-proven content digests; build only keys without a candidate
  # through the same planner, build and smoke path.
  images:
    name: Recipe runtime images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/recipe-images.yml

  # Heals the mirror: a declared blob the release lost is re-fetched from its
  # origin, verified, and uploaded. Nothing needs it and it never fails: what it
  # cannot heal is a warning, and the next main run tries again.
  adapter-source-mirror:
    name: Keep the adapter source mirror whole
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    # Never marks the publish run failed: nothing depends on this job.
    continue-on-error: true
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: ./.github/actions/setup-tooling

      - name: Install producer contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mirror-venv"
          uv venv --python 3.14 "$venv"
          uv pip install --python "$venv/bin/python" -e contracts
          echo "MIRROR_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      # Restore only: a blob is already in the cache when the materializing jobs
      # saved it; reconcile fetches from origin just for what no cache holds.
      - name: Restore adapter source blobs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vonk-forge-recipes/adapter-sources
          key: adapter-sources-${{ hashFiles('adapter-sources.json') }}
          restore-keys: adapter-sources-

      - name: Re-upload declared blobs missing from the mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$MIRROR_PYTHON" tools/adapter-sources reconcile'

  # Runs are queued in merge order. When main has moved on, the newer run
  # publishes (it contains this commit), so this one skips instead of
  # publishing older content over a newer release.
  head-of-main:
    name: Check this commit is still the head of main
    needs: [validate, producer-contracts, images]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Compare with the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved to $head; the newer run publishes, skipping $GITHUB_SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Create signed library release
    needs: [contract-version, validate, producer-contracts, images, head-of-main]
    # Image promotion or fallback builds must complete before signing.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && needs.contract-version.result == 'success'
      && needs.validate.result == 'success'
      && needs.producer-contracts.result == 'success'
      && needs.images.result == 'success'
      && needs.head-of-main.outputs.current == 'true' }}
    runs-on: ubuntu-24.04
    environment: recipe-release
    outputs:
      # False when the release already held this exact asset set.
      changed: ${{ steps.current.outputs.skip != 'true' }}
    # Control planes accept only assets whose SHA256SUMS carries a Sigstore
    # attestation from this workflow on refs/heads/main of this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: ./.github/actions/setup-tooling

      # In this workspace only: the index, coverage and bundle name this version.
      - name: Stamp the computed contract version
        shell: bash
        env:
          CONTRACT_VERSION: ${{ needs.contract-version.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/contract-version stamp \
            contracts/src/vonk_forge_contracts/_version.py --version "$CONTRACT_VERSION"

      - name: Install producer contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/release-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          echo "RELEASE_TEST_PYTHON=$test_venv/bin/python" >> "$GITHUB_ENV"

      - name: Resolve the release version and update time
        id: release
        shell: bash
        env:
          CONTRACT_VERSION: ${{ needs.contract-version.outputs.version }}
        run: |
          set -euo pipefail
          version=$("$RELEASE_TEST_PYTHON" -c 'from vonk_forge_contracts import CONTRACT_VERSION; print(CONTRACT_VERSION)')
          if [ "$version" != "$CONTRACT_VERSION" ]; then
            echo "::error::the installed contracts report $version, not the computed $CONTRACT_VERSION" >&2
            exit 1
          fi
          updated_at=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$GITHUB_SHA")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "updated_at=$updated_at" >> "$GITHUB_OUTPUT"

      - name: Download the byte-verified catalog build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-build
          path: ${{ runner.temp }}/catalog-build

      - name: Download the pinned prebuilt images
        id: prebuilt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prebuilt-images
          path: ${{ runner.temp }}/prebuilt

      - name: Download the image plan for release verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recipe-image-plan
          path: ${{ runner.temp }}/plan

      # Declared adapter sources are verified once into this cache; the key follows
      # the manifest, and the restore prefix keeps blobs an older manifest held.
      - name: Cache adapter source blobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vonk-forge-recipes/adapter-sources
          key: adapter-sources-${{ hashFiles('adapter-sources.json') }}
          restore-keys: adapter-sources-

      - name: Build release assets from the release commit
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          test -s "$RUNNER_TEMP/prebuilt/prebuilt-images.json"
          # Coverage is derived offline from the byte-verified catalog build of
          # this commit (the authority is derived from it, not committed).
          "$RELEASE_TEST_PYTHON" tools/build-family-aware-coverage \
            --catalog-root "$RUNNER_TEMP/catalog-build"
          "$RELEASE_TEST_PYTHON" tools/build-catalog-index \
            --release-dir "$RUNNER_TEMP/release" \
            --source-commit "$GITHUB_SHA" --source-date-epoch "$epoch" \
            --include qualification/coverage/family-aware-coverage-2026-09-24.json \
            --include qualification/coverage/family-aware-coverage-2026-09-24.md \
            --prebuilt-images "$RUNNER_TEMP/prebuilt/prebuilt-images.json" \
            --include "$RUNNER_TEMP/plan/plan.json"
          "$RELEASE_TEST_PYTHON" tools/check-published-images \
            --plan "$RUNNER_TEMP/plan/plan.json" \
            --images "$RUNNER_TEMP/prebuilt/prebuilt-images.json" \
            --index "$RUNNER_TEMP/release/catalog-index.json" \
            --source-commit "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare with the published release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Only a published release counts: the tags endpoint never returns a
          # draft, so a draft left by a run that failed before undrafting is
          # replaced by the publish step instead of blocking every later run.
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "wheel=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          wheel=missing
          if "$RELEASE_TEST_PYTHON" tools/sync-release-assets --tag "$RELEASE_TAG" has-wheel; then
            wheel=present
          fi
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          # Skip only when the release holds exactly recipe-library.tar and its
          # wheel, and that bundle carries this SHA256SUMS with every member matching it.
          if "$RELEASE_TEST_PYTHON" tools/sync-release-assets --tag "$RELEASE_TAG" \
            check --sums "$RUNNER_TEMP/release/SHA256SUMS"; then
            echo "release $RELEASE_TAG already publishes this complete asset set"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Only when the release lacks its version's wheel: a new version, or a run
      # killed between tagging and uploading. A wheel never changes once uploaded.
      # It is built from the commit that cut the version (the tag; a new version is
      # tagged at this commit), with the version stamped into that exported tree.
      - name: Build the contracts wheel of a version that lacks one
        if: steps.current.outputs.skip != 'true' && steps.current.outputs.wheel == 'missing'
        id: wheel
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.current.outputs.exists }}
          CONTRACT_VERSION: ${{ needs.contract-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
          if source=$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}"); then
            :
          elif [ "$RELEASE_EXISTS" = true ]; then
            echo "::error::release $RELEASE_TAG exists but its tag cannot be read" >&2
            exit 1
          else
            source=$GITHUB_SHA
          fi
          tree="$RUNNER_TEMP/wheel-source"
          mkdir -p "$tree"
          git archive "$source" contracts | tar -x -C "$tree"
          python3 tools/contract-version stamp \
            "$tree/contracts/src/vonk_forge_contracts/_version.py" --version "$CONTRACT_VERSION"
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel" "$tree/contracts"
          wheels=("$RUNNER_TEMP/wheel"/*-"$CONTRACT_VERSION"-py3-none-any.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "::error::expected one contracts wheel of $CONTRACT_VERSION, found ${wheels[*]}" >&2
            exit 1
          fi
          wheel=${wheels[0]}
          echo "Contracts wheel of $RELEASE_TAG built from $source" >> "$GITHUB_STEP_SUMMARY"
          echo "path=$wheel" >> "$GITHUB_OUTPUT"

      # Consumers verify the wheel with `gh attestation verify <wheel> --repo
      # CarstVaartjes/vonk-forge-recipes --signer-workflow
      # CarstVaartjes/vonk-forge-recipes/.github/workflows/publish.yml`. It stays out
      # of SHA256SUMS, which every in-place update rewrites.
      - name: Attest the contracts wheel
        if: steps.wheel.outputs.path != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.wheel.outputs.path }}

      - name: Attest the release checksum manifest
        if: steps.current.outputs.skip != 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/SHA256SUMS

      - name: Publish or update the contract-version release
        if: steps.current.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPDATED_AT: ${{ steps.release.outputs.updated_at }}
          RELEASE_EXISTS: ${{ steps.current.outputs.exists }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          WHEEL: ${{ steps.wheel.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          cp "$ATTESTATION_BUNDLE" "$release/SHA256SUMS.sigstore.json"
          title="Vonk Forge recipes $RELEASE_TAG (updated $UPDATED_AT)"
          notes="Recipe library for contract ${RELEASE_TAG#v}, updated $UPDATED_AT from $GITHUB_SHA."
          # One asset holds the whole signed library: SHA256SUMS, its Sigstore
          # bundle and every listed file, deterministically. The version's wheel is
          # the release's only other asset.
          bundle="$RUNNER_TEMP/bundle/recipe-library.tar"
          mkdir -p "$(dirname "$bundle")"
          "$RELEASE_TEST_PYTHON" tools/build-release-bundle "$release" "$bundle"
          if [ "$RELEASE_EXISTS" != "true" ]; then
            # Delete leftover drafts of this tag, then upload the bundle and the
            # wheel to a fresh draft first: "latest" must never name a release
            # without them. Undrafting creates the tag at --target when it is missing.
            drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$RELEASE_TAG\") | .id")
            for id in $drafts; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" "$bundle" ${WHEEL:+"$WHEEL"}
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          # Upload the bundle when missing or different and the wheel when
          # missing, delete every other asset, and verify the release's digests
          # and sizes. The run fails unless the release converges to exactly the
          # bundle and its wheel.
          "$RELEASE_TEST_PYTHON" tools/sync-release-assets --tag "$RELEASE_TAG" \
            publish --bundle "$bundle" ${WHEEL:+--wheel "$WHEEL"}
          gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes" --latest

  # The site follows the newest release; its own schedule is only the backstop.
  # A separate job keeps the refresh App's key out of the signing job. The
  # release is already published when this runs, so a failed dispatch is a
  # visible failed job (the site then waits for its schedule) that neither fails
  # this run nor touches the release.
  dispatch-site:
    name: Start the public site build
    needs: [publish]
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dispatch the site build
        env:
          REFRESH_APP_CLIENT_ID: ${{ vars.REFRESH_APP_CLIENT_ID }}
          REFRESH_APP_PRIVATE_KEY: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
        run: python3 tools/dispatch-site-build
