name: Validate recipes

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      producer_only:
        description: Run only producer-owned checks when called by publication
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request supersedes its previous run. Publication calls
# and manual runs never cancel each other (each gets its own group).
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: Prove changed runtime images
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/recipe-images.yml

  validate:
    if: ${{ !inputs.producer_only }}
    uses: CarstVaartjes/vonk-forge/.github/workflows/validate-recipe-library.yml@3dacd2e652984d7cccb95c3688dde98ff40f4d7b
    with:
      # Keep the validator and platform checkout on the same reviewed commit.
      # It builds this checkout's index/packages, validates current contract
      # and archive contents, and checks every option choice against Forge's
      # runtime policy.
      platform_ref: 3dacd2e652984d7cccb95c3688dde98ff40f4d7b

  # Build the catalog once and prove it deterministic: two independent builds
  # of this tree must produce identical bytes (consumers reproduce a release by
  # rebuilding its tagged commit). Both layouts are built twice and compared;
  # on publication the proven checkout-layout build is uploaded and coverage
  # reads it instead of building again.
  catalog:
    if: ${{ inputs.producer_only || github.event_name != 'workflow_call' }}
    name: Build the catalog twice and require identical bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: ./.github/actions/setup-tooling

      # Declared adapter sources are verified once into this cache; the key follows
      # the manifest, and the restore prefix keeps blobs an older manifest held.
      - name: Cache adapter source blobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vonk-forge-recipes/adapter-sources
          key: adapter-sources-${{ hashFiles('adapter-sources.json') }}
          restore-keys: adapter-sources-

      - name: Build the release asset set twice and require identical bytes
        shell: bash
        run: |
          set -euo pipefail
          # Git runs here, at the CI edge; the tool takes the commit and epoch.
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          test_venv="$RUNNER_TEMP/catalog-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          root="$RUNNER_TEMP/catalog-build"
          # Two independent builds of each layout: the release asset set and the
          # checkout-layout set that publication derives coverage from. Each PID
          # is waited on separately so every exit code counts.
          pids=()
          for n in first second; do
            "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/release-$n" \
              --source-commit "$GITHUB_SHA" --source-date-epoch "$epoch" &
            pids+=($!)
            "$test_venv/bin/python" tools/build-catalog-index --output-dir "$RUNNER_TEMP/root-$n" \
              --source-commit "$GITHUB_SHA" --source-date-epoch "$epoch" &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          diff -r "$RUNNER_TEMP/release-first" "$RUNNER_TEMP/release-second"
          diff -r "$RUNNER_TEMP/root-first" "$RUNNER_TEMP/root-second"
          mv "$RUNNER_TEMP/root-first" "$root"

      # Only publication reads it (coverage); pull requests upload nothing.
      - name: Upload the verified catalog build
        if: inputs.producer_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-build
          path: ${{ runner.temp }}/catalog-build
          if-no-files-found: error
          retention-days: 1

  # Required check: the image fan-in, so a failed matrix (or a catalog that is
  # not byte-identical) cannot be merged merely because the other required
  # producer/platform checks are green. The producer checks run in
  # producer-contracts.
  catalog-index:
    needs: [images, catalog]
    if: ${{ always() && github.event_name == 'pull_request' }}
    name: Verify catalog index
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require PR image proof
        env:
          IMAGE_RESULT: ${{ needs.images.result }}
          CATALOG_RESULT: ${{ needs.catalog.result }}
        run: test "$IMAGE_RESULT" = success && test "$CATALOG_RESULT" = success

  producer-contracts:
    if: ${{ inputs.producer_only || github.event_name != 'workflow_call' }}
    name: Validate producer contracts and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: ./.github/actions/setup-tooling

      - name: Install producer contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/recipe-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" \
            -e contracts \
            -r .github/requirements-producer-tests.txt
          echo "RECIPE_TEST_PYTHON=$test_venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify generated contract examples are current
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/generate-contract-examples
          if ! git diff --quiet -- contracts/src/vonk_forge_contracts/examples; then
            echo 'Generated contract examples are stale; run tools/generate-contract-examples' >&2
            git diff -- contracts/src/vonk_forge_contracts/examples
            exit 1
          fi

      - name: Require current public contract schemas
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/generate-contract-schemas --check

      # Declared adapter sources, verified once; only the catalog and publish jobs
      # save this cache, every other job restores it (a miss fetches from the mirror).
      - name: Restore adapter source blobs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vonk-forge-recipes/adapter-sources
          key: adapter-sources-${{ hashFiles('adapter-sources.json') }}
          restore-keys: adapter-sources-

      # The test suite's build (tests/generated_catalog.py, fixed provenance, no
      # git) is built once here, before the workers start; the release builds
      # and their byte-equality proof are the catalog job's.
      - name: Build the test suite's catalog once
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated"
          "$RECIPE_TEST_PYTHON" tests/generated_catalog.py "$generated"
          "$RECIPE_TEST_PYTHON" tools/build-family-aware-coverage --catalog-root "$generated"
          echo "VONK_RECIPES_GENERATED_DIR=$generated" >> "$GITHUB_ENV"

      - name: Reject a changed Spark count for an existing recipe
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 tools/check-recipe-topology --base origin/main

      # A released contract version means one thing: publish.yml tags the first
      # release of each version, so once v<version> exists, any change under
      # contracts/src needs a new version in _version.py. Git runs here.
      - name: Require a contract version bump for a changed contract
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' contracts/src/vonk_forge_contracts/_version.py)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no MAJOR.MINOR.PATCH __version__ in contracts/src/vonk_forge_contracts/_version.py"
            exit 1
          fi
          tag="v$version"
          # Its own line, so a failed ls-remote fails the step (set -e).
          refs=$(git ls-remote --tags origin "refs/tags/$tag")
          if [[ -z "$refs" ]]; then
            echo "$tag is not released yet; contracts/src may still change"
            exit 0
          fi
          git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
          if ! git diff --quiet "$tag" HEAD -- contracts/src; then
            echo "::error::contracts/src differs from the released $tag; bump __version__ in contracts/src/vonk_forge_contracts/_version.py"
            git diff --stat "$tag" HEAD -- contracts/src
            exit 1
          fi

      # A platform pin on a PR branch commit stops resolving when that branch is
      # deleted after its squash merge, and every recipes workflow then fails to
      # load. Each pinned SHA must be an ancestor of vonk-forge main.
      - name: Require every platform pin to be reachable from vonk-forge main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(python3 tools/prebuilt-images platform-ref)
          status=$(gh api "repos/CarstVaartjes/vonk-forge/compare/${ref}...main" --jq .status)
          case "$status" in
            ahead|identical) echo "platform pin ${ref} is on vonk-forge main ($status)" ;;
            *) echo "::error::platform pin ${ref} is not an ancestor of vonk-forge main ($status)"; exit 1 ;;
          esac

      # The Controller reads a recipe with the contracts version its lock pins.
      # A serving kind or Model capability newer than that is a read failure there, so
      # it may not land until the pinned platform reads it. The minimum per
      # value is owned by src/recipe_tooling/qualification/introduced.py.
      - name: Require every recipe to be readable by the pinned platform
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(python3 tools/prebuilt-images platform-ref)
          gh api "repos/CarstVaartjes/vonk-forge/contents/control/packaging/public-contracts.lock?ref=${ref}" \
            -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/platform-contracts.lock"
          "$RECIPE_TEST_PYTHON" tools/check-platform-contracts --platform-lock "$RUNNER_TEMP/platform-contracts.lock"

      - name: Require touched multi-Spark vLLM recipes to bound KV by need
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/check-recipe-memory-need --base origin/main

      - name: Require API facts on every touched OpenAI-interface recipe
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --name-only --diff-filter=AMR --merge-base origin/main
            git ls-files --others --exclude-standard
          } | "$RECIPE_TEST_PYTHON" tools/check-recipe-api --changed-files -

      - name: Require every recipe to reference Models this library holds
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/check-recipe-model-references

      - name: Require touched Models' capabilities to agree with their modalities and served routes
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --name-only --diff-filter=AMR --merge-base origin/main
            git ls-files --others --exclude-standard
          } | "$RECIPE_TEST_PYTHON" tools/check-model-modalities --changed-files -

      - name: Check that the catalog hierarchy in the Model displays is one tree
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/check-model-families

      - name: Require every Dockerfile COPY/ADD source in its build context
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/check-build-context-sources

      # Upstream trees are keyed by immutable commit sha; a changed pin changes
      # the key, and the restore prefix keeps every other commit's cached tree.
      - name: Cache upstream trees for the vendored-file check
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vonk-forge-upstream
          key: vonk-forge-upstream-${{ hashFiles('adapters/**/Dockerfile', 'adapters/**/vendored-upstream.json') }}
          restore-keys: vonk-forge-upstream-

      - name: Require vendored adapter files to match upstream at the pinned commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/check-vendored-upstream

      # A kit-built recipe pins only its kit; the base is what the kit declares
      # at that commit. Re-reads the declaring file and fails when the committed
      # kit-lock.json (or what consumes it) differs, so generated pins are never
      # hand-edited or left behind.
      - name: Require kit-declared base pins to be locked and current
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/kit-pins check

      # A recipe that runs its source's published image (policy/published-images.json)
      # must state the build commit that image records; checked for the recipes
      # this change touches.
      - name: Require recipes that run their source's image to claim its commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/check-image-provenance --base origin/main

      # The change's added lines, written once for the "Reject new ..." tools
      # that judge only added lines. Git runs here, at the edge, through the one
      # entry point that owns the diff flags and the pathspec; the tools and
      # their tests take the diff as text.
      - name: Write the added-lines diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/added-lines --base origin/main > "$RUNNER_TEMP/added.diff"

      # A file over 1 MiB is declared with tools/adapter-sources add, never committed.
      # Only files this PR adds or changes are checked (stat-ed: a text diff has no
      # binary sizes), repository-wide, with no waiver.
      - name: Reject added or changed files over 1 MiB
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=AMR origin/main...HEAD > "$RUNNER_TEMP/changed.txt"
          python3 tools/check-added-file-size --paths-from "$RUNNER_TEMP/changed.txt"

      # A changed evidence file keeps only what the readers consult (newest-only):
      # R1-R3 of tools/check-evidence-retention, independent of recipe digests.
      - name: Reject evidence files that carry more than the readers consult
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/check-evidence-retention --paths-from "$RUNNER_TEMP/changed.txt"

      # GB10 shares one memory pool between CPU and CUDA: new adapter code may
      # not build a full model as real CPU tensors or pin a model constructor
      # to CUDA. Checks only lines added against main.
      - name: Reject new eager or CUDA-pinned model construction in adapters
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-model-construction-device --base origin/main

      # Containers run with a read-only root: image-private state variables
      # (STATE_PATH and the like) must point under /tmp or /outputs. Checks
      # only added ENV lines of the Dockerfiles recipes build.
      - name: Reject new image-private state paths on the read-only image
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-writable-state-env --base origin/main

      # Recipe, Model and display JSON are read through the contract package
      # (vonk_forge_contracts, src/recipe_tooling/qualification/documents.py). Checks only lines
      # added against main.
      - name: Reject new raw reads of recipe, Model or display documents
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-document-reads --diff "$RUNNER_TEMP/added.diff"

      # A new or changed adapter image whose final stage is a plain CUDA runtime base and
      # copies a compiled binary runs `ldd` on it, so a missing library fails the build.
      - name: Reject new runtime images that do not check copied binaries with ldd
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-final-stage-ldd --diff "$RUNNER_TEMP/added.diff"

      # Tests never use git: a tool takes its changed set, commit or epoch as an
      # argument, and git runs only here, at the CI edge. Checks only added lines.
      - name: Reject new tests that run git
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-test-git --diff "$RUNNER_TEMP/added.diff"

      # Independent sweep reads fan out through spark_sweep.fanout.gather; a Controller
      # call in a loop says '# sequential: <reason>'. Checks only added lines.
      - name: Reject new serial Controller calls in sweep loops
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-serial-reads --diff "$RUNNER_TEMP/added.diff"

      # Provider URLs are opened only through src/recipe_tooling/upstream_http.fetch: a 429 is
      # retried and then "not checked this run", never a failure or an issue.
      - name: Reject new raw urlopen in tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-raw-urlopen --diff "$RUNNER_TEMP/added.diff"

      # An adapter never sets its own NCCL_IB_HCA: the platform names both RDMA devices of a
      # 200 Gb/s port, and a single device halves the link. Checks only added lines.
      - name: Reject adapter lines that narrow NCCL_IB_HCA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-nccl-ib-hca --diff "$RUNNER_TEMP/added.diff"

      - name: Reject new tests that gate on a real recipe's declared memory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-estimate-gates --diff "$RUNNER_TEMP/added.diff"

      # Every pull request, push and manual run executes the whole suite and
      # every static gate below; nothing is selected by path.
      - name: Run the producer tests
        shell: bash
        run: |
          set -euo pipefail
          # Tests run in parallel (xdist worksteal, as vonk-forge does); a
          # failure prints its own traceback, so -vv's per-test lines are
          # dropped. Dump stacks for a stalled test; this does not change
          # production retry or observation deadlines.
          # Only a real stall dumps: a dump racing a slow test's C code once
          # segfaulted the whole suite (exit 139).
          "$RECIPE_TEST_PYTHON" -m pytest -n auto --dist worksteal -o faulthandler_timeout=300 tests/

      - name: Lint the repository with Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff check --force-exclude -- .

      - name: Check formatting with Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff format --check --force-exclude -- .

      - name: Type check the repository with Pyright
        shell: bash
        run: |
          set -euo pipefail
          scripts/check-python-types

      - name: Build and externally import the contracts wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/contracts-wheel"
          consumer_venv="$RUNNER_TEMP/contracts-consumer-venv"
          consumer_cwd="$RUNNER_TEMP/contracts-consumer"
          uv build --wheel --out-dir "$wheel_dir" contracts
          uv venv --python 3.14 "$consumer_venv"
          uv pip install --python "$consumer_venv/bin/python" "$wheel_dir"/*.whl
          mkdir -p "$consumer_cwd"
          (
            cd "$consumer_cwd"
            "$consumer_venv/bin/python" - <<'PY'
          from importlib.resources import files

          import json

          from vonk_forge_contracts import document_sha256, read_model, read_recipe
          from vonk_forge_contracts.resolver import validate_recipe_models

          examples = files("vonk_forge_contracts").joinpath("examples")
          document = json.loads(examples.joinpath("model-definition.json").read_text())
          models = {document_sha256(document): read_model(document)}
          lfs = json.loads(examples.joinpath("model-definition-github-lfs.json").read_text())
          assert read_model(lfs).source.provider == "github-lfs"
          for name in ("recipe-source-build.json", "recipe-job.json", "recipe-dual.json"):
              recipe = read_recipe(json.loads(examples.joinpath(name).read_text()))
              validate_recipe_models(recipe, models)
          print("External wheel import and three Recipe resolutions: OK")
          PY
          )
