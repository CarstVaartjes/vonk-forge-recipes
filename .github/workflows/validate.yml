name: Validate recipes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: CarstVaartjes/vonk-forge/.github/workflows/validate-recipe-library.yml@b4190c8c8a9a68d456c509a5c540b39d7036f59b
    with:
      platform_ref: b4190c8c8a9a68d456c509a5c540b39d7036f59b

  catalog-index:
    name: Verify catalog index
    runs-on: ubuntu-24.04
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated catalog index
        run: python3 tools/build-catalog-index --check
