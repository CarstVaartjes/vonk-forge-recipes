name: Validate recipes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      producer_only:
        description: Run only producer-owned checks when called by publication
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request supersedes its previous run. Main pushes and
# publication calls never cancel each other (each gets its own group).
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: ${{ !inputs.producer_only }}
    uses: CarstVaartjes/vonk-forge/.github/workflows/validate-recipe-library.yml@f26923bdd462aec433895c5675358f57adce8b01
    with:
      # Use the reviewed Forge validator for this launch contract. Its exact
      # published commit verifies declared source namespaces, Model payload
      # separation and archive identities independently of this recipe PR.
      # Pinned to the platform commit whose validator builds the catalog index
      # and packages from this checkout before validating them.
      platform_ref: f26923bdd462aec433895c5675358f57adce8b01

  # Pull requests and main pushes get these checks inside producer-contracts
  # (one runner, not three); a skipped job still satisfies its required check.
  catalog-index:
    if: ${{ !inputs.producer_only && github.event_name != 'pull_request' && github.event_name != 'push' }}
    name: Verify catalog index
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      # The index and packages are build outputs, not committed files.
      # Consumers reproduce a release by rebuilding its tagged commit, so two
      # independent builds of this tree must produce identical bytes.
      - name: Build the release asset set twice and require identical bytes
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/catalog-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" -e contracts
          "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/first"
          "$test_venv/bin/python" tools/build-catalog-index --release-dir "$RUNNER_TEMP/second"
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          echo "RECIPE_CATALOG_PYTHON=$test_venv/bin/python" >> "$GITHUB_ENV"

      - name: Derive family-aware coverage from the current catalog
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_CATALOG_PYTHON" tools/build-catalog-index
          "$RECIPE_CATALOG_PYTHON" tools/build-family-aware-coverage

  producer-contracts:
    if: ${{ inputs.producer_only || github.event_name != 'workflow_call' }}
    name: Validate producer contracts and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      - name: Decide light (recipe data only) or full checks
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # Recipe data (recipes, models, adapters, qualification definitions,
          # README, creators) gets the light checks: the platform validator,
          # packaging checks and the recipe-wide tests. Any other change
          # (contracts, tools, tests, workflows) gets the full suite.
          case "${{ github.event_name }}" in
            pull_request)
              git fetch --no-tags origin "${{ github.base_ref }}"
              base=$(git merge-base FETCH_HEAD HEAD) ;;
            push) base="${{ github.event.before }}" ;;
            *) base= ;;
          esac
          full=true
          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Capture first: grep -q exiting early must not fail the pipeline.
            changed=$(git diff --name-only "$base" HEAD)
            other=$(grep -Ev '^(recipes/|models/|adapters/|qualification/definitions\.json$|README\.md$|creators\.json$)' <<<"$changed" | grep -v '^$' || true)
            if [[ -z "$other" ]]; then full=false; else echo "Not recipe data:"; head -20 <<<"$other"; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Checks: $([[ $full == true ]] && echo full || echo light)"

      - name: Install producer contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/recipe-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" \
            -e contracts \
            'jsonschema>=4.24,<5' \
            'pytest==9.1.1'
          echo "RECIPE_TEST_PYTHON=$test_venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify generated contract examples are current
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/generate-contract-examples
          if ! git diff --quiet -- contracts/src/vonk_forge_contracts/examples; then
            echo 'Generated contract examples are stale; run tools/generate-contract-examples' >&2
            git diff -- contracts/src/vonk_forge_contracts/examples
            exit 1
          fi

      - name: Require current public contract schemas
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/generate-contract-schemas --check

      - name: Build the catalog index twice and require identical bytes
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" tools/build-catalog-index --release-dir "$RUNNER_TEMP/first"
          "$RECIPE_TEST_PYTHON" tools/build-catalog-index --release-dir "$RUNNER_TEMP/second"
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          "$RECIPE_TEST_PYTHON" tools/build-catalog-index
          "$RECIPE_TEST_PYTHON" tools/build-family-aware-coverage

      - name: Check the README overview (advisory)
        shell: bash
        # Advisory only: other recipe PRs merging makes any open PR's README
        # stale, so failing here would block every parallel PR. Recipe PRs
        # regenerate it; the next one catches it up (eventually consistent).
        run: |
          if ! tools/build-readme-overview --check; then
            echo "::warning title=README overview stale::Run tools/build-readme-overview and commit README.md"
          fi

      - name: Reject a changed Spark count for an existing recipe
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 tools/check-recipe-topology --base origin/main

      - name: Require every recipe to reference Models this library holds
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-recipe-model-references

      - name: Require every Dockerfile COPY/ADD source in its build context
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-build-context-sources

      # Upstream trees are keyed by immutable commit sha; a changed pin changes
      # the key, and the restore prefix keeps every other commit's cached tree.
      - name: Cache upstream trees for the vendored-file check
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vonk-forge-upstream
          key: vonk-forge-upstream-${{ hashFiles('adapters/**/Dockerfile', 'adapters/**/vendored-upstream.json') }}
          restore-keys: vonk-forge-upstream-

      - name: Require vendored adapter files to match upstream at the pinned commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/check-vendored-upstream

      - name: Run the recipe-wide tests
        if: steps.scope.outputs.full != 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" -m pytest -q \
            tests/test_recipe_*.py tests/test_qualification_*.py \
            tests/test_release_assets.py tests/test_exact_model_file_closure.py \
            tests/test_explicit_hf_file_manifest_closure.py \
            tests/test_distributed_recipe_availability.py \
            tests/test_family_aware_coverage.py

      - name: Run the full producer test suite
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$RECIPE_TEST_PYTHON" -m pytest -q

      - name: Lint the repository with pinned Ruff
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" tools/check-python-lint

      - name: Check formatting with pinned Ruff
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" tools/check-python-format

      - name: Type check the repository with pinned Pyright
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" scripts/check-python-types

      - name: Build and externally import the contracts wheel
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/contracts-wheel"
          consumer_venv="$RUNNER_TEMP/contracts-consumer-venv"
          consumer_cwd="$RUNNER_TEMP/contracts-consumer"
          uv build --wheel --out-dir "$wheel_dir" contracts
          uv venv --python 3.14 "$consumer_venv"
          uv pip install --python "$consumer_venv/bin/python" "$wheel_dir"/*.whl
          mkdir -p "$consumer_cwd"
          (
            cd "$consumer_cwd"
            "$consumer_venv/bin/python" - <<'PY'
          from importlib.resources import files

          import json

          from vonk_forge_contracts import document_sha256, read_model, read_recipe
          from vonk_forge_contracts.resolver import validate_recipe_models

          examples = files("vonk_forge_contracts").joinpath("examples")
          document = json.loads(examples.joinpath("model-definition.json").read_text())
          models = {document_sha256(document): read_model(document)}
          for name in ("recipe-source-build.json", "recipe-job.json", "recipe-dual.json"):
              recipe = read_recipe(json.loads(examples.joinpath(name).read_text()))
              validate_recipe_models(recipe, models)
          print("External wheel import and three Recipe resolutions: OK")
          PY
          )

  public-contracts:
    if: ${{ !inputs.producer_only && github.event_name != 'pull_request' && github.event_name != 'push' }}
    name: Verify public contracts package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: false

      - name: Test, lint, and build public contracts
        shell: bash
        run: |
          set -euo pipefail
          test_venv="$RUNNER_TEMP/contracts-test-venv"
          uv venv --python 3.14 "$test_venv"
          uv pip install --python "$test_venv/bin/python" \
            'pydantic>=2.13,<3' 'jsonschema>=4.24,<5' 'pytest==9.1.1'
          "$test_venv/bin/pytest" -q tests/test_contracts.py
          "$test_venv/bin/python" tools/generate-contract-schemas --check
          "$test_venv/bin/python" tools/generate-contract-examples
          if ! git diff --quiet -- contracts/src/vonk_forge_contracts/examples; then
            echo 'Generated contract examples are stale; run tools/generate-contract-examples' >&2
            git diff -- contracts/src/vonk_forge_contracts/examples
            exit 1
          fi
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" \
            tools/check-python-lint

          wheel_dir="$RUNNER_TEMP/contracts-wheel"
          uv build --wheel --out-dir "$wheel_dir" contracts
          consumer_venv="$RUNNER_TEMP/contracts-consumer-venv"
          uv venv --python 3.14 "$consumer_venv"
          uv pip install --python "$consumer_venv/bin/python" "$wheel_dir"/*.whl
          consumer_cwd="$RUNNER_TEMP/contracts-consumer"
          mkdir -p "$consumer_cwd"
          (
            cd "$consumer_cwd"
            "$consumer_venv/bin/python" - <<'PY'
          from importlib.resources import files

          import json

          from vonk_forge_contracts import document_sha256, read_model, read_recipe
          from vonk_forge_contracts.resolver import validate_recipe_models

          examples = files("vonk_forge_contracts").joinpath("examples")
          document = json.loads(examples.joinpath("model-definition.json").read_text())
          models = {document_sha256(document): read_model(document)}
          for name in ("recipe-source-build.json", "recipe-job.json", "recipe-dual.json"):
              recipe = read_recipe(json.loads(examples.joinpath(name).read_text()))
              validate_recipe_models(recipe, models)
          print("External wheel import and three Recipe resolutions: OK")
          PY
          )
