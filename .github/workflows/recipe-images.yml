name: Recipe runtime images

# Builds each distinct recipe runtime image on a GitHub-hosted ARM64 runner and
# pushes it to GHCR as ghcr.io/<owner>/vonk-forge-recipe-<slug>:build-<key>
# (plus :<version>). The key is Vonk Forge's executable build key; Controllers
# derive the same key and pull the pinned digest instead of building on a Spark.
#
# validate.yml builds changed keys at the PR head and writes candidate-<key>
# only after build-time native checks and the remote-code smoke succeed.
# publish.yml uses the same planner to promote those digests to build-<key>;
# keys without a candidate use the same build path during publication.
on:
  # Independent recovery owner; publication tags do not retire missing keys.
  schedule:
    - cron: '23 3 * * *'
  workflow_call:
    inputs:
      slugs:
        description: "Space-separated recipe ids or 'all' (default: every missing image)"
        type: string
        default: ""
      republish:
        description: "Dispatch publish.yml afterwards"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated recipe ids, or 'all' for every missing image"
        type: string
        default: all
      republish:
        description: "Dispatch publish.yml afterwards so the index pins the new digests"
        type: boolean
        default: true

permissions:
  contents: read

# The Vonk Forge commit whose planner derives the build keys, the exact Spark
# build flags and the platform adaptation stage is the `platform_ref` that
# publish.yml validates the library with: one pin, read from there. Controllers
# compare the same key. PRs compare base/head keys; publication promotes by key.

jobs:
  plan:
    name: Plan images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      builds: ${{ steps.select.outputs.builds }}
      build_count: ${{ steps.select.outputs.build_count }}
      bounded: ${{ steps.select.outputs.bounded }}
      bounded_count: ${{ steps.select.outputs.bounded_count }}
      copy_count: ${{ steps.select.outputs.copy_count }}
      deferred_slugs: ${{ steps.select.outputs.deferred_slugs }}
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the platform ref
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          echo "ref=$(python3 tools/prebuilt-images platform-ref)" >> "$GITHUB_OUTPUT"

      - name: Check out the Vonk Forge planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CarstVaartjes/vonk-forge
          ref: ${{ steps.platform.outputs.ref }}
          path: .vonk-forge

      - name: Set up uv
        uses: ./.github/actions/setup-tooling

      - name: Build the Controller protocol wheel
        uses: ./.vonk-forge/.github/actions/prepare-control-wheel
        with:
          repository-root: .vonk-forge

      - name: Plan one image per distinct build key
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          plan_library() {
            local platform=${4:-$GITHUB_WORKSPACE/.vonk-forge}
            "$platform/scripts/build-recipe-library" "$1"
            uv run --project "$platform/control" --frozen \
              --with-requirements "$GITHUB_WORKSPACE/.github/requirements-platform-tooling.txt" \
              --with-editable "$1/contracts" \
              "$platform/scripts/recipe-image-plan" \
              --library-root "$1" --output-dir "$2" > "$3"
          }
          plan_library "$GITHUB_WORKSPACE" "$RUNNER_TEMP/images" "$RUNNER_TEMP/plan.json"
          if [ "$EVENT_NAME" = pull_request ]; then
            git clone --shared --no-checkout . "$RUNNER_TEMP/image-base"
            git -C "$RUNNER_TEMP/image-base" checkout --detach "$BASE_SHA"
            base_ref=$(python3 tools/prebuilt-images platform-ref \
              --workflow "$RUNNER_TEMP/image-base/.github/workflows/publish.yml")
            base_platform="$GITHUB_WORKSPACE/.vonk-forge"
            if [ "$base_ref" != "${{ steps.platform.outputs.ref }}" ]; then
              git -C .vonk-forge fetch --depth=1 origin "$base_ref"
              base_platform="$RUNNER_TEMP/base-platform"
              git -C .vonk-forge worktree add --detach "$base_platform" "$base_ref"
              "$base_platform/scripts/build-control-wheel"
            fi
            plan_library "$RUNNER_TEMP/image-base" "$RUNNER_TEMP/base-images" "$RUNNER_TEMP/base-plan.json" "$base_platform"
          fi
          uv run --python 3.14 --no-project --with-editable contracts \
            python tools/prepare-remote-code-smoke \
            --plan "$RUNNER_TEMP/plan.json" --output-dir "$RUNNER_TEMP/images"

      - name: Select missing images
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SLUGS: ${{ github.event_name == 'schedule' && 'all' || inputs.slugs }}
        shell: bash
        run: |
          set -euo pipefail
          select_args=()
          if [ "$EVENT_NAME" = pull_request ]; then
            select_args+=(--base-plan "$RUNNER_TEMP/base-plan.json")
          fi
          python3 tools/prebuilt-images select "${select_args[@]}" --plan "$RUNNER_TEMP/plan.json" \
            --owner "${{ github.repository_owner }}" \
            --slugs "$SLUGS" --output "$RUNNER_TEMP/selection.json"
          if [ "$EVENT_NAME" = pull_request ] && [ "$SAME_REPOSITORY" != true ] \
            && [ "$(jq '.builds | length' "$RUNNER_TEMP/selection.json")" != 0 ]; then
            echo '::error::Changed images need candidate push permission. Run this head on a trusted repository branch; fork tokens cannot publish proof.'
            exit 1
          fi
          # Ship only the plan and the build contexts of the selected keys.
          mkdir -p "$RUNNER_TEMP/upload"
          cp "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/selection.json" "$RUNNER_TEMP/upload/"
          cp "$SSL_CERT_FILE" "$RUNNER_TEMP/upload/ca-bundle.crt"
          for key in $(jq -r '.builds[].build_key, .bounded[].build_key' "$RUNNER_TEMP/selection.json"); do
            cp -r "$RUNNER_TEMP/images/$key" "$RUNNER_TEMP/upload/$key"
          done
          {
            echo "builds=$(jq -c '[.builds[] | {build_key}]' "$RUNNER_TEMP/selection.json")"
            echo "build_count=$(jq '.builds | length' "$RUNNER_TEMP/selection.json")"
            echo "bounded=$(jq -c '[.bounded[] | {build_key}]' "$RUNNER_TEMP/selection.json")"
            echo "bounded_count=$(jq '.bounded | length' "$RUNNER_TEMP/selection.json")"
            echo "deferred_slugs=$(jq -r '.deferred_slugs | join(" ")' "$RUNNER_TEMP/selection.json")"
            echo "copy_count=$(jq '.copies | length' "$RUNNER_TEMP/selection.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Recipe images"
            echo "Requested: \`${SLUGS:-all}\`; platform: \`${{ steps.platform.outputs.ref }}\`"
            echo
            jq -r '.builds[] | "- build `\(.build_key[0:12])` for \([.recipes[].slug] | join(", "))"' "$RUNNER_TEMP/selection.json"
            jq -r '.bounded[] | "- bounded proof `\(.build_key[0:12])` for \([.recipes[].slug] | join(", ")) (prebuilt-image-exclusions.json: the Spark build is the full proof)"' "$RUNNER_TEMP/selection.json"
            jq -r '.copies[] | "- copy to `\(.to)`"' "$RUNNER_TEMP/selection.json"
            jq -r '.deferred[] | "- deferred to a later run: `\(.[0:12])`"' "$RUNNER_TEMP/selection.json"
            jq -r '.skipped[]? | "- not planned: \(.slug): \(.reason)"' "$RUNNER_TEMP/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recipe-image-plan
          path: ${{ runner.temp }}/upload
          retention-days: 7
          # Build contexts contain dotfiles (state/.keep, .dockerignore, vendored
          # .vendored-from-commit); without them a COPY of an otherwise empty
          # directory fails here although the Controller's bundle has it.
          include-hidden-files: true

  copy:
    name: Tag shared images
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.copy_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the image plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-image-plan
          path: ${{ runner.temp }}/plan

      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tooling and current CA certificates
        uses: ./.github/actions/setup-tooling

      - name: Copy existing images to the recipes that share them
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin
          jq -c '.copies[]' "$RUNNER_TEMP/plan/selection.json" | while read -r copy; do
            from=$(jq -r .from <<<"$copy")
            for target in $(jq -r '.to, .version_tag' <<<"$copy"); do
              skopeo copy --retry-times 3 --preserve-digests "docker://$from" "docker://$target"
            done
          done

  # A changed key that only recipes in prebuilt-image-exclusions.json use
  # cannot finish on a hosted runner; the Spark build and the hardware sweep
  # are its full proof. Check what a build would read first instead: the
  # Dockerfile parses for linux/arm64 and every base image resolves.
  bounded:
    name: Bounded proof ${{ matrix.build_key }}
    needs: plan
    if: needs.plan.outputs.bounded_count != '0' && needs.plan.outputs.bounded_count != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bounded) }}
    env:
      KEY: ${{ matrix.build_key }}
    steps:
      - name: Download the image plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-image-plan
          path: ${{ runner.temp }}/plan

      - name: Check the Dockerfile and its base images without building
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/plan/$KEY"
          # BuildKit's check parses every stage, resolves each FROM for the
          # target platform and runs no instruction.
          docker buildx build --check --platform linux/arm64 \
            --build-arg BUILDKIT_SYNTAX=docker/dockerfile:1.12@sha256:93bfd3b68c109427185cd78b4779fc82b484b0b7618e36d0f104d4d801e66d25 \
            --file context/Dockerfile context
          echo "- \`${KEY:0:12}\`: bounded proof (Dockerfile check); full proof is the Spark build" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.build_key }}
    needs: plan
    if: needs.plan.outputs.build_count != '0'
    runs-on: ubuntu-24.04-arm
    # The heaviest measured recipe (GLM 5.3 Flash EXL3, CUDA compile) takes 16
    # minutes end to end; a runaway build must not hold publication for hours.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      KEY: ${{ matrix.build_key }}
    steps:
      - name: Download the image plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-image-plan
          path: ${{ runner.temp }}/plan

      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk and add swap
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft \
            /opt/google /usr/lib/jvm || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          work=/var/lib/vonk
          sudo mkdir -p "$work/storage" "$work/tmp"
          printf '[storage]\ndriver = "overlay"\ngraphroot = "%s/storage"\nrunroot = "/run/containers/storage"\n' "$work" \
            | sudo tee /etc/containers/storage.conf >/dev/null
          # CUDA compiles peak near the runner's 15 GiB; swap turns a peak into
          # a slowdown instead of an OOM kill.
          sudo swapoff -a || true
          sudo fallocate -l 16G "$work/swapfile"
          sudo chmod 600 "$work/swapfile"
          sudo mkswap "$work/swapfile" >/dev/null
          sudo swapon "$work/swapfile"
          echo "WORK=$work" >> "$GITHUB_ENV"
          df -h / ; free -h

      - name: Set up tooling and current CA certificates
        uses: ./.github/actions/setup-tooling

      - name: Build the recipe image with the Spark build flags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/plan/$KEY"
          image=$(jq -c --arg key "$KEY" '.images[] | select(.build_key == $key)' "$RUNNER_TEMP/plan/plan.json")
          echo "$GH_TOKEN" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          for base in $(jq -r '.base_images[]' <<<"$image"); do
            sudo TMPDIR="$WORK/tmp" podman pull --platform linux/arm64 "$base"
          done
          mapfile -t recipe_args < <(jq -r '.recipe_build_arguments[]' <<<"$image")
          start=$(date +%s)
          build_with_retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "Build attempt $attempt failed; retaining layer cache for retry" >&2
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 15))"; fi
            done
            return 1
          }
          build_with_retry sudo TMPDIR="$WORK/tmp" podman --runtime=/usr/bin/crun build --network=host \
            "${recipe_args[@]}" --tag localhost/vonk/recipe-build context
          # Deterministic dependency errors fail here, outside the build retry.
          # Use the recipe interpreter/venv and no GPU or model weights.
          if [ -f remote-code-smoke.py ]; then
            sudo podman run --rm --read-only --tmpfs /tmp \
              --env HOME=/tmp --env HF_HOME=/tmp/huggingface --env XDG_CACHE_HOME=/tmp/cache \
              --env SSL_CERT_FILE=/tmp/ca-bundle.crt --env REQUESTS_CA_BUNDLE=/tmp/ca-bundle.crt \
              --volume "$RUNNER_TEMP/plan/ca-bundle.crt:/tmp/ca-bundle.crt:ro" \
              --volume "$PWD/remote-code-smoke.py:/tmp/remote-code-smoke.py:ro" \
              --entrypoint python3 localhost/vonk/recipe-build /tmp/remote-code-smoke.py
          fi
          mkdir -p adapter
          jq -r '.adapter_containerfile' <<<"$image" > adapter/Containerfile
          mapfile -t adapter_args < <(jq -r '.adapter_build_arguments[]' <<<"$image")
          build_with_retry sudo TMPDIR="$WORK/tmp" podman --runtime=/usr/bin/crun build \
            "${adapter_args[@]}" \
            --build-arg "$(jq -r '.adapter_build_argument' <<<"$image")=localhost/vonk/recipe-build" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "ai.vonkforge.build-key=$KEY" \
            --tag localhost/vonk/runtime-image adapter
          echo "build_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Push to every recipe that uses this image
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/plan/selection.json"
          mapfile -t repositories < <(jq -r --arg key "$KEY" \
            '.builds[] | select(.build_key == $key) | .recipes[].repository' "$selection")
          mapfile -t versions < <(jq -r --arg key "$KEY" \
            '.builds[] | select(.build_key == $key) | .recipes[] | (.version // "latest")' "$selection")
          first=${repositories[0]}
          prefix=build
          if [ "$EVENT_NAME" = pull_request ]; then prefix=candidate; fi
          sudo TMPDIR="$WORK/tmp" podman push --digestfile "$RUNNER_TEMP/digest" \
            localhost/vonk/runtime-image "docker://$first:$prefix-$KEY"
          digest=$(cat "$RUNNER_TEMP/digest")
          # Same (root) credentials as the podman login above.
          for index in "${!repositories[@]}"; do
            tags=("$prefix-$KEY")
            if [ "$EVENT_NAME" != pull_request ]; then tags+=("${versions[$index]}"); fi
            for tag in "${tags[@]}"; do
              target="${repositories[$index]}:$tag"
              [ "$target" = "$first:$prefix-$KEY" ] && continue
              sudo skopeo copy --retry-times 3 --preserve-digests "docker://$first@$digest" "docker://$target"
            done
            # Controllers pull anonymously: the package must be public.
            skopeo inspect --no-creds --raw "docker://${repositories[$index]}@$digest" >/dev/null
          done
          if [ "$WORKFLOW_NAME" = "Publish recipe library release" ]; then
            echo "- \`$KEY\`: built at publish: no PR candidate" >> "$GITHUB_STEP_SUMMARY"
          fi
          size=$(sudo podman image inspect --format '{{.Size}}' localhost/vonk/runtime-image)
          echo "- \`${KEY:0:12}\` → \`$first@$digest\` (${size} bytes, built in ${build_seconds}s) for ${#repositories[@]} recipe(s)" >> "$GITHUB_STEP_SUMMARY"

  resolve:
    name: Resolve pinned images
    needs: [plan, copy, build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tooling and current CA certificates
        uses: ./.github/actions/setup-tooling

      - name: Download the image plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-image-plan
          path: ${{ runner.temp }}/plan

      - name: Look up every recipe's image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resolved"
          python3 tools/prebuilt-images resolve --plan "$RUNNER_TEMP/plan/plan.json" \
            --owner "${{ github.repository_owner }}" \
            --output "$RUNNER_TEMP/resolved/prebuilt-images.json" | tee "$RUNNER_TEMP/resolved.txt"
          {
            echo "### Prebuilt images"
            echo '```'
            cat "$RUNNER_TEMP/resolved.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pinned images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-images
          path: ${{ runner.temp }}/resolved/prebuilt-images.json
          retention-days: 7

  continue:
    name: Continue deferred image builds
    needs: [plan, build, copy, resolve]
    # Failed builds in this batch must not starve the deferred tail. Each
    # continuation carries only that tail, independently of the publication tag.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.deferred_slugs != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch the remaining keys
        env:
          GH_TOKEN: ${{ github.token }}
          DEFERRED: ${{ needs.plan.outputs.deferred_slugs }}
        run: gh workflow run recipe-images.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f slugs="$DEFERRED" -f republish=true

  republish:
    name: Republish with the new images
    needs: [plan, resolve, build, copy]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (inputs.republish || (github.event_name == 'schedule' && (needs.plan.outputs.build_count != '0' || needs.plan.outputs.copy_count != '0'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch the publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" --ref main
