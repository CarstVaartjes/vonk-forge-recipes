name: Refresh recipe overview

# The README overview (engines, Spark variants, creators) is generated from
# recipes/, models/ and creators.json. Recipe PRs never regenerate it, so they
# cannot conflict on README.md; this workflow refreshes it after each merge by opening ONE long-lived PR
# (branch bot/readme-overview) with auto-merge, because the main ruleset
# requires PRs and status checks and has no bypass actors.
#
# Checks: PRs/pushes made with GITHUB_TOKEN do not start other workflows, but
# workflow_dispatch is exempt, so this workflow dispatches the real validate.yml
# on the bot branch; its runs report the required check names on the PR head.
#
# Repo setting needed: Actions > General > "Allow GitHub Actions to create and
# approve pull requests" (otherwise gh pr create is refused).
#
#
# Loop safety: the merged README-only PR does not match the trigger paths, and
# the job skips when the actor is github-actions[bot]. A run with nothing to
# change is a no-op.
on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "models/**"
      - "creators.json"
      - "tools/build-readme-overview"
  workflow_dispatch:

concurrency:
  group: refresh-recipe-overview
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  BRANCH: bot/readme-overview
  GH_TOKEN: ${{ github.token }}

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Regenerate the overview
        run: python3 tools/build-readme-overview

      - name: Open or update the overview PR
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')"
          if git diff --quiet -- README.md; then
            echo "overview is current"
            if [ -n "$existing" ]; then
              gh pr close "$existing" --delete-branch \
                --comment "Overview is already current on main."
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "Refresh recipe overview" -- README.md
          git push --force origin "$BRANCH"
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Refresh recipe overview" \
              --body "Regenerated by tools/build-readme-overview. Auto-merges once the required checks pass."
          fi
          # Real validation on the new head (workflow_dispatch is allowed to
          # start workflows from GITHUB_TOKEN); it reports the required checks.
          gh workflow run validate.yml --ref "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash
