# Tooling updates only. Recipe inputs (platform_ref, the protocol wheel, adapter sources,
# image pins) are never bumped by a bot: they change a proven recipe's identity.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-tooling"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/.github"
    schedule:
      interval: weekly
    groups:
      ci-tooling:
        patterns: ["*"]
