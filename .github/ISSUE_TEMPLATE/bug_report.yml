name: Bug report
description: Something does not work as described.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version and setup
      description: Recipe id, catalog version, number of Sparks and Vonk Forge version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or output
      description: Paste the relevant output. Remove keys, tokens and private addresses first.
      render: text
